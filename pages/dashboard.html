<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабинет — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo"><span class="logo-mark">✦</span> Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html" class="active">Проекты</a>
      <a href="create.html">Создать сайт</a>
      <a href="editor.html">Редактор кода</a>
      <a href="links.html">Ссылки</a>
      <a href="neuro.html">Нейро</a>
      <a href="settings.html">Настройки</a>
      <a href="media.html">Медиа AI</a>
    </nav>
    <div class="side-user">
      <strong id="userLogin">—</strong>
      <a href="#" id="logout">Выйти</a>
      <div style="margin-top:12px;line-height:1.5">Поддержка<br><a href="tel:+79002373222">+7 (900) 237-32-22</a><br><a href="mailto:superyaroslav8@iCloud.com">superyaroslav8@iCloud.com</a></div>
    </div>
  </aside>
  <main class="main">
    <div class="page-head"><h1>Мои проекты</h1><a class="btn-primary" href="create.html">+ Новый сайт</a></div>
    <div id="list"></div>
  </main>
</div>
<script src="../js/core.js"></script>
<script>
  const session = AC.requireAuth();
  AC.applyTheme();
  document.getElementById('userLogin').textContent = session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href='../index.html'; };
  function render() {
    const sites = AC.getUserSites(session.login);
    const el = document.getElementById('list');
    if (!sites.length) {
      el.innerHTML = `<div class="empty"><h3>Пока нет проектов</h3><p>Опиши идею — соберём сайт как на host-ai.</p><a class="btn-primary" href="create.html" style="margin-top:16px">Создать сайт</a></div>`;
      return;
    }
    el.innerHTML = `<div class="grid-cards">${sites.map(s => `
      <div class="card"><h3>${AC.escapeHtml(s.name)}</h3>
      <div class="meta">${AC.escapeHtml(s.subdomain)}.${AC.escapeHtml(s.domain)}</div>
      <p>${AC.escapeHtml((s.description||'').slice(0,120))}</p>
      <div class="card-actions">
        <a href="editor.html?id=${s.id}">Код</a>
        <a href="#" data-open="${s.id}">Открыть</a>
        <button data-del="${s.id}">Удалить</button>
      </div></div>`).join('')}</div>`;
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Удалить?')) { AC.deleteSite(session.login, b.dataset.del); render(); }});
    el.querySelectorAll('[data-open]').forEach(a => a.onclick = e => {
      e.preventDefault();
      const site = AC.getUserSites(session.login).find(x => x.id === a.dataset.open);
      if (!site?.files?.['index.html']) return alert('Нет содержимого');
      const w = window.open('', '_blank');
      let full = site.files['index.html'];
      if (full.includes('</head>')) full = full.replace('</head>', `<style>${site.files['style.css']||''}</style></head>`).replace('<script src="script.js"></script>', `<script>${site.files['script.js']||''}<\/script>`);
      w.document.write(full); w.document.close();
    });
  }
  render();
</script>
</body>
</html>
