<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="hero-bg" style="position:fixed;inset:0;pointer-events:none;">
      <div class="orb orb-1" style="opacity:0.3;"></div>
      <div class="orb orb-2" style="opacity:0.25;"></div>
    </div>
    <div class="auth-card">
      <a href="../index.html" class="logo" style="justify-content:center;margin-bottom:24px;">
        <span class="logo-icon">✦</span>
        <span class="logo-text">Ai крафт</span>
      </a>
      <h1>Вход</h1>
      <p class="subtitle">Только логин и пароль. Без проверок.</p>
      <div class="auth-error" id="authError"></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login">Логин</label>
          <input type="text" id="login" name="login" placeholder="ваш_логин" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary auth-submit">Войти</button>
      </form>
      <p class="auth-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script>
    // Redirect if already logged in
    if (getSession()) window.location.href = 'dashboard.html';
  </script>
</body>
</html>
