<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Собрать сайт — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .ai-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;min-height:calc(100vh - 100px)}
    @media(max-width:960px){.ai-grid{grid-template-columns:1fr}}
    .ai-panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column}
    .ai-panel h1{font-size:22px;margin-bottom:6px}
    .lead{color:var(--text-muted);font-size:14px;margin-bottom:16px}
    .ai-steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .ai-step{padding:6px 12px;border-radius:999px;font-size:12px;border:1px solid var(--border);color:var(--text-muted)}
    .ai-step.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
    .ai-compose textarea{min-height:100px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:14px;width:100%;resize:vertical;outline:none;margin-bottom:10px}
    .domain-box{margin-top:12px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--border)}
    .domain-mode{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .addr-row{display:flex;gap:8px;flex-wrap:wrap}
    .addr-row input,.addr-row select{flex:1;min-width:110px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
    .preview-shell{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:460px}
    .preview-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted)}
    .preview-shell iframe{flex:1;border:0;width:100%;min-height:400px;background:#fff}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo">Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html">Мои сайты</a>
      <a href="create.html" class="active">Собрать сайт</a>
      <a href="neuro.html">Нейро</a>
      <a href="media.html">Медиа</a>
      <a href="links.html">Ссылки</a>
      <a href="settings.html">Настройки</a>
    </nav>
    <div class="side-user"><strong id="userLogin">—</strong><a href="#" id="logout">Выйти</a></div>
  </aside>
  <main class="main">
    <div class="ai-grid">
      <div class="ai-panel">
        <div class="ai-steps">
          <span class="ai-step on" id="s1">1. Идея</span>
          <span class="ai-step" id="s2">2. Адрес</span>
          <span class="ai-step" id="s3">3. Готово</span>
        </div>
        <h1>Опишите сайт</h1>
        <p class="lead">Обычными словами. Разделы подстроятся под текст.</p>
        <textarea id="idea" placeholder="Сайт кофейни: тёплый свет, меню, о нас, контакты."></textarea>
        <button type="button" class="btn-primary" id="btnBuild">Собрать по описанию</button>
        <div class="domain-box" id="domainBox" hidden>
          <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:8px">Адрес</label>
          <div class="domain-mode">
            <button type="button" class="chip active" data-mode="sub">Поддомен</button>
            <button type="button" class="chip" data-mode="custom">Свой домен</button>
          </div>
          <div id="subFields" class="addr-row">
            <input id="sub" placeholder="pauza">
            <select id="tld">
              <option value="ai_craft.ru">.ai_craft.ru</option>
              <option value="ai_craft.com">.ai_craft.com</option>
              <option value="ai_craft.dev">.ai_craft.dev</option>
            </select>
          </div>
          <div id="customFields" class="addr-row" hidden>
            <input id="customDomain" placeholder="мой-сайт.ru" style="flex:1">
          </div>
          <button type="button" class="btn-primary btn-block" id="btnPublish" style="margin-top:12px">Сохранить сайт</button>
        </div>
      </div>
      <div class="preview-shell">
        <div class="preview-top">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span id="prevUrl">предпросмотр</span>
        </div>
        <iframe id="preview" title="Превью"></iframe>
      </div>
    </div>
  </main>
</div>
<nav class="mobile-nav">
  <a href="dashboard.html">Сайты</a>
  <a href="create.html" class="active">Собрать</a>
  <a href="neuro.html">Нейро</a>
  <a href="settings.html">Ещё</a>
</nav>
<script src="../js/core.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const session = AC.requireAuth('../index.html');
  if (!session) return;
  AC.applyTheme();
  document.getElementById('userLogin').textContent = session.name || session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href = '../index.html'; };
  let mode = 'sub', built = null;
  function setStep(n) { [1,2,3].forEach(i => document.getElementById('s'+i).classList.toggle('on', i <= n)); }
  document.querySelectorAll('.domain-mode .chip').forEach(c => c.onclick = () => {
    mode = c.dataset.mode;
    document.querySelectorAll('.domain-mode .chip').forEach(x => x.classList.toggle('active', x === c));
    document.getElementById('subFields').hidden = mode !== 'sub';
    document.getElementById('customFields').hidden = mode !== 'custom';
    updateUrl();
  });
  function updateUrl() {
    if (mode === 'custom') document.getElementById('prevUrl').textContent = document.getElementById('customDomain').value.trim() || 'ваш-домен.ru';
    else document.getElementById('prevUrl').textContent = (document.getElementById('sub').value.trim() || 'project') + '.' + document.getElementById('tld').value;
  }
  document.getElementById('sub').oninput = updateUrl;
  document.getElementById('tld').onchange = updateUrl;
  document.getElementById('customDomain').oninput = updateUrl;
  function showPreview(html, css) {
    document.getElementById('preview').srcdoc = html.replace('</head>', '<style>' + css + '</style></head>').replace(/<script[^>]*script\.js[^>]*><\/script>/i, '');
  }
  document.getElementById('btnBuild').onclick = () => {
    const idea = document.getElementById('idea').value.trim();
    if (idea.length < 8) { AC.toast('Опишите подробнее'); return; }
    const btn = document.getElementById('btnBuild');
    btn.disabled = true; btn.textContent = 'Собираем…';
    setTimeout(() => {
      const parsed = AC.parseIdea(idea);
      const html = AC.generateSiteHTML(idea, parsed.title);
      const css = AC.generateSiteCSS(parsed.tone);
      built = { description: idea, name: parsed.title, html, css, js: '', tone: parsed.tone };
      showPreview(html, css);
      document.getElementById('domainBox').hidden = false;
      setStep(2);
      if (!document.getElementById('sub').value) {
        document.getElementById('sub').value = (parsed.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 20)) || 'site';
      }
      updateUrl();
      btn.disabled = false; btn.textContent = 'Собрать снова';
      AC.toast('Собрано по описанию');
    }, 400);
  };
  document.getElementById('btnPublish').onclick = () => {
    if (!built) { AC.toast('Сначала соберите сайт'); return; }
    let subdomain, domain, customDomain = '';
    if (mode === 'custom') {
      customDomain = document.getElementById('customDomain').value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');
      if (!customDomain.includes('.')) { AC.toast('Укажите домен, например shop.ru'); return; }
      subdomain = customDomain.split('.')[0]; domain = customDomain;
    } else {
      subdomain = document.getElementById('sub').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      domain = document.getElementById('tld').value;
      if (subdomain.length < 2) { AC.toast('Укажите поддомен'); return; }
    }
    AC.createSite(session.login, {
      name: built.name, subdomain, domain,
      customDomain: mode === 'custom' ? customDomain : '',
      description: built.description,
      files: { 'index.html': built.html, 'style.css': built.css, 'script.js': built.js },
      published: true
    });
    setStep(3); AC.toast('Сайт сохранён');
    setTimeout(() => location.href = 'dashboard.html', 700);
  };
  showPreview(AC.generateSiteHTML('Здесь появится сайт по описанию.', 'Ai крафт'), AC.generateSiteCSS('neutral'));
});
</script>
</body>
</html>
