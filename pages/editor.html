<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body{overflow:hidden}
    .ide{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
    .ide-bar{height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg-alt)}
    .ide-bar .logo{font-size:15px;margin-right:8px}
    .ide-bar select{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;max-width:200px}
    .ide-bar .spacer{flex:1}
    .ide-bar .hint{font-size:12px;color:var(--text-muted)}
    .ide-body{display:flex;flex:1;min-height:0}
    .ide-files{width:200px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg-alt);display:flex;flex-direction:column}
    .ide-files-head{padding:10px 12px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .ide-files-head button{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);color:var(--accent);background:var(--accent-soft)}
    .ide-file-list{flex:1;overflow:auto;padding:6px}
    .ide-file{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--text-muted);margin-bottom:2px}
    .ide-file:hover{background:var(--surface);color:var(--text)}
    .ide-file.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .ide-work{flex:1;display:flex;flex-direction:column;min-width:0}
    .ide-tabs{display:flex;gap:2px;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
    .ide-tab{padding:7px 14px;border-radius:8px;font-size:12px;color:var(--text-muted);white-space:nowrap}
    .ide-tab.active{background:var(--surface);color:var(--text);font-weight:600}
    .ide-split{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
    .ide-split.no-preview{grid-template-columns:1fr}
    .ide-code-pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
    .ide-code-label{padding:6px 12px;font-size:11px;color:var(--text-muted);background:var(--surface-2);border-bottom:1px solid var(--border)}
    .ide-code-pane textarea{flex:1;width:100%;border:0;resize:none;padding:14px 16px;background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--editor-font-size,14px);line-height:1.55;outline:none}
    .ide-preview-pane{display:flex;flex-direction:column;min-width:0;background:#fff}
    .ide-preview-label{padding:6px 12px;font-size:11px;color:#666;background:#f4f4f5;border-bottom:1px solid #e4e4e7;display:flex;justify-content:space-between}
    .ide-preview-pane iframe{flex:1;width:100%;border:0;background:#fff}
    .ide-empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px;color:var(--text-muted)}
    .ide-empty h2{color:var(--text);font-size:18px;margin-bottom:8px}
    .ide-empty p{font-size:14px;max-width:360px;margin:0 auto 16px}
    @media(max-width:900px){.ide-files{width:150px}.ide-split{grid-template-columns:1fr}.ide-preview-pane{display:none}}
    @media(max-width:600px){.ide-files{display:none}.ide-bar .hint{display:none}}
  </style>
</head>
<body>
<div class="ide">
  <div class="ide-bar">
    <a href="dashboard.html" class="logo">Ai крафт</a>
    <select id="project" title="Проект"></select>
    <button class="btn-ghost btn-sm" type="button" id="btnNewFile">+ Файл</button>
    <button class="btn-ghost btn-sm" type="button" id="btnPreview">Открыть превью</button>
    <div class="spacer"></div>
    <span class="hint" id="status">Выберите проект сверху</span>
    <button class="btn-primary btn-sm" type="button" id="btnSave">Сохранить</button>
    <a class="btn-ghost btn-sm" href="dashboard.html">К проектам</a>
  </div>
  <div class="ide-body">
    <aside class="ide-files">
      <div class="ide-files-head"><span>Файлы</span><button type="button" id="btnAddFile">Добавить</button></div>
      <div class="ide-file-list" id="fileList"></div>
    </aside>
    <div class="ide-work">
      <div class="ide-empty" id="emptyState">
        <div>
          <h2>Редактор кода</h2>
          <p>1. Выберите проект сверху<br>2. Откройте файл слева<br>3. Пишите код — превью справа обновится само</p>
          <a class="btn-primary" href="create.html">Сначала создать сайт</a>
        </div>
      </div>
      <div id="editorUI" hidden>
        <div class="ide-tabs" id="tabs"></div>
        <div class="ide-split" id="split">
          <div class="ide-code-pane">
            <div class="ide-code-label">Код · <span id="activeName">—</span></div>
            <textarea id="code" spellcheck="false" placeholder="Пишите код здесь…"></textarea>
          </div>
          <div class="ide-preview-pane">
            <div class="ide-preview-label"><span>Превью сайта</span><span>HTML + CSS + JS</span></div>
            <iframe id="frame" title="Превью"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/core.js"></script>
<script>
  const session = AC.requireAuth();
  const settings = AC.getSettings();
  AC.applyTheme(settings);
  const $ = id => document.getElementById(id);
  const projectSel = $('project');
  const codeEl = $('code');
  const params = new URLSearchParams(location.search);
  let sites = AC.getUserSites(session.login);
  let currentId = params.get('id') || '';
  let files = {};
  let active = '';
  let openTabs = [];
  projectSel.innerHTML = '<option value="">— Выберите проект —</option>' +
    sites.map(s => `<option value="${s.id}">${AC.escapeHtml(s.name)}</option>`).join('');
  if (currentId) projectSel.value = currentId;
  function setStatus(t) { $('status').textContent = t; }
  function showEditor(on) { $('emptyState').hidden = on; $('editorUI').hidden = !on; }
  function fileNames() { return Object.keys(files).sort(); }
  function renderFiles() {
    const list = $('fileList');
    const names = fileNames();
    if (!names.length) { list.innerHTML = '<p style="padding:12px;font-size:12px;color:var(--text-muted)">Нет файлов. Нажмите «Добавить».</p>'; return; }
    list.innerHTML = names.map(f => `<button type="button" class="ide-file ${f===active?'active':''}" data-f="${AC.escapeHtml(f)}">${AC.escapeHtml(f)}</button>`).join('');
    list.querySelectorAll('[data-f]').forEach(b => b.onclick = () => openFile(b.dataset.f));
  }
  function renderTabs() {
    if (!openTabs.includes(active) && active) openTabs.push(active);
    openTabs = openTabs.filter(t => files[t] !== undefined);
    $('tabs').innerHTML = openTabs.map(f => `<button type="button" class="ide-tab ${f===active?'active':''}" data-f="${AC.escapeHtml(f)}">${AC.escapeHtml(f)}</button>`).join('');
    $('tabs').querySelectorAll('.ide-tab').forEach(t => t.onclick = () => openFile(t.dataset.f));
    $('activeName').textContent = active || '—';
  }
  function openFile(name) {
    if (active) files[active] = codeEl.value;
    active = name;
    codeEl.value = files[name] || '';
    renderFiles(); renderTabs(); refreshPreview();
    setStatus('Файл: ' + name);
  }
  function refreshPreview() {
    if (!settings.showPreview) { $('split').classList.add('no-preview'); return; }
    $('split').classList.remove('no-preview');
    const html = files['index.html'] || files[fileNames().find(f => f.endsWith('.html'))] || '';
    const css = [files['style.css'], files['styles.css'], files['main.css']].filter(Boolean).join('\n');
    const js = [files['script.js'], files['main.js'], files['app.js']].filter(Boolean).join('\n');
    if (!html) { $('frame').srcdoc = '<p style="font-family:system-ui;padding:24px;color:#666">Добавьте index.html — тогда здесь будет превью.</p>'; return; }
    let doc = html;
    if (doc.includes('</head>')) doc = doc.replace('</head>', '<style>' + css + '</style></head>');
    else doc = '<style>' + css + '</style>' + doc;
    if (/src=["']script\.js["']/.test(doc)) doc = doc.replace(/<script src=["']script\.js["']><\/script>/, '<script>' + js + '<\/script>');
    else doc += '<script>' + js + '<\/script>';
    $('frame').srcdoc = doc;
  }
  function loadProject(id) {
    sites = AC.getUserSites(session.login);
    const site = sites.find(s => s.id === id);
    if (!site) { showEditor(false); setStatus('Проект не найден'); return; }
    currentId = id;
    files = { ...(site.files || {}) };
    if (!Object.keys(files).length) {
      files = {
        'index.html': AC.generateSiteHTML(site.description || site.name, site.name),
        'style.css': AC.generateSiteCSS(),
        'script.js': '// Ai крафт\n'
      };
    }
    active = files['index.html'] !== undefined ? 'index.html' : fileNames()[0];
    openTabs = [active];
    codeEl.value = files[active] || '';
    showEditor(true); renderFiles(); renderTabs(); refreshPreview();
    setStatus('Проект: ' + site.name);
  }
  function addFile() {
    if (!currentId) { AC.toast('Сначала выберите проект'); return; }
    const name = prompt('Имя файла\nНапример: about.html, style.css, app.js');
    if (!name) return;
    const clean = name.trim().replace(/[^a-zA-Z0-9._-]/g, '');
    if (!clean) { AC.toast('Некорректное имя'); return; }
    if (files[clean] !== undefined) { AC.toast('Такой файл уже есть'); return; }
    files[clean] = ''; openFile(clean); AC.toast('Файл создан');
  }
  function save() {
    if (!currentId) { AC.toast('Нет проекта'); return; }
    if (active) files[active] = codeEl.value;
    AC.updateSite(session.login, currentId, { files: { ...files } });
    setStatus('Сохранено'); AC.toast('Сохранено');
  }
  let timer;
  codeEl.addEventListener('input', () => {
    if (!active) return;
    files[active] = codeEl.value; refreshPreview();
    if (settings.autoSave && currentId) {
      clearTimeout(timer); timer = setTimeout(save, 1000); setStatus('Печатаете…');
    }
  });
  projectSel.onchange = () => {
    if (!projectSel.value) { showEditor(false); setStatus('Выберите проект'); return; }
    loadProject(projectSel.value);
  };
  $('btnSave').onclick = save;
  $('btnNewFile').onclick = addFile;
  $('btnAddFile').onclick = addFile;
  $('btnPreview').onclick = () => {
    if (active) files[active] = codeEl.value; refreshPreview();
    const w = window.open('', '_blank');
    if (w) { w.document.write($('frame').srcdoc); w.document.close(); }
  };
  if (currentId) loadProject(currentId);
  else if (sites.length === 1) { projectSel.value = sites[0].id; loadProject(sites[0].id); }
  else showEditor(false);
</script>
</body>
</html>
