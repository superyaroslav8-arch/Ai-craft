<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Медиа — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo">Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html">Мои сайты</a>
      <a href="create.html">Собрать сайт</a>
      <a href="neuro.html">Нейро</a>
      <a href="media.html" class="active">Медиа</a>
      <a href="links.html">Ссылки</a>
      <a href="settings.html">Настройки</a>
    </nav>
    <div class="side-user"><strong id="userLogin">—</strong><a href="#" id="logout">Выйти</a></div>
  </aside>
  <main class="main">
    <div class="page-head"><h1>Медиа</h1></div>
    <div class="domain-row" id="tabs" style="margin-bottom:20px">
      <button type="button" class="chip active" data-tab="photo">Фото</button>
      <button type="button" class="chip" data-tab="video">Видео</button>
      <button type="button" class="chip" data-tab="music">Музыка</button>
    </div>
    <div class="create-layout">
      <div class="prompt-box">
        <h2 id="tabTitle">Сгенерировать фото</h2>
        <p class="hint" id="tabHint">Опишите изображение для сайта.</p>
        <div class="form-group"><label>Описание</label><textarea id="prompt" placeholder="Логотип кофейни, тёплый свет"></textarea></div>
        <div class="form-group" id="styleRow"><label>Стиль</label>
          <select id="style"><option value="realistic">Реализм</option><option value="illustration">Иллюстрация</option><option value="minimal">Минимализм</option></select>
        </div>
        <button class="btn-primary" type="button" id="gen">Сгенерировать</button>
        <p id="status" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></p>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Результат</h3>
        <div id="result" style="min-height:200px;display:grid;place-items:center;background:var(--bg);border-radius:12px;border:1px dashed var(--border);color:var(--text-muted);padding:16px">Превью появится здесь</div>
      </div>
    </div>
    <div style="margin-top:24px"><h2 style="font-size:14px;color:var(--text-muted);margin-bottom:12px">История</h2><div id="history" class="grid-cards"></div></div>
  </main>
</div>
<nav class="mobile-nav">
  <a href="dashboard.html">Сайты</a>
  <a href="create.html">Собрать</a>
  <a href="neuro.html">Нейро</a>
  <a href="settings.html">Ещё</a>
</nav>
<script src="../js/core.js"></script>
<script>
  const session = AC.requireAuth(); AC.applyTheme();
  document.getElementById('userLogin').textContent = session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href='../index.html'; };
  const KEY = 'aicraft_media_' + session.login;
  let tab = 'photo', history = [];
  try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}
  const titles = { photo: ['Сгенерировать фото', 'Опишите изображение.'], video: ['Сгенерировать видео', 'Опишите ролик.'], music: ['Сгенерировать музыку', 'Жанр и настроение.'] };
  document.querySelectorAll('#tabs .chip').forEach(c => c.onclick = () => {
    tab = c.dataset.tab;
    document.querySelectorAll('#tabs .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    document.getElementById('tabTitle').textContent = titles[tab][0];
    document.getElementById('tabHint').textContent = titles[tab][1];
    document.getElementById('styleRow').style.display = tab === 'photo' ? '' : 'none';
  });
  function gradient(seed) {
    let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return 'linear-gradient(135deg,hsl(' + (h%360) + ',70%,45%),hsl(' + ((h*7)%360) + ',65%,35%))';
  }
  function renderHistory() {
    const el = document.getElementById('history');
    if (!history.length) { el.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Пока пусто</p>'; return; }
    el.innerHTML = history.slice(0,12).map(h => '<div class="card"><div style="height:80px;border-radius:10px;margin-bottom:8px;background:'+h.bg+'"></div><div class="meta">'+h.type+'</div><p>'+AC.escapeHtml(h.prompt.slice(0,70))+'</p></div>').join('');
  }
  document.getElementById('gen').onclick = () => {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { AC.toast('Напишите описание'); return; }
    const btn = document.getElementById('gen');
    btn.disabled = true; document.getElementById('status').textContent = 'Генерация…';
    setTimeout(() => {
      const bg = gradient(prompt + tab);
      history.unshift({ type: tab, prompt, bg, at: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(history.slice(0,40)));
      document.getElementById('result').innerHTML = '<div style="width:100%;min-height:160px;border-radius:12px;background:'+bg+';display:grid;place-items:center;color:#fff;padding:16px;text-align:center">'+AC.escapeHtml(prompt.slice(0,80))+'</div>';
      document.getElementById('status').textContent = 'Готово'; btn.disabled = false; renderHistory(); AC.toast('Готово');
    }, 800);
  };
  renderHistory();
</script>
</body>
</html>
