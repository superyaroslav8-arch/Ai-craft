<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Медиа AI — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo"><span class="logo-mark">✦</span> Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html">Проекты</a>
      <a href="create.html">Создать сайт</a>
      <a href="editor.html">Редактор кода</a>
      <a href="links.html">Ссылки</a>
      <a href="neuro.html">Нейро</a>
      <a href="settings.html">Настройки</a>
      <a href="media.html" class="active">Медиа AI</a>
    </nav>
    <div class="side-user"><strong id="userLogin">—</strong><a href="#" id="logout">Выйти</a></div>
  </aside>
  <main class="main">
    <div class="page-head"><h1>Генерация медиа</h1></div>
    <div class="grid-cards">
      <div class="card">
        <h3>🖼️ Фото</h3>
        <div class="form-group" style="margin-top:12px"><label>Промпт</label><textarea id="photoP" placeholder="Минималистичный офис, мягкий свет"></textarea></div>
        <button class="btn-primary btn-sm" id="photoBtn">Сгенерировать</button>
        <div id="photoOut" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></div>
      </div>
      <div class="card">
        <h3>🎬 Видео</h3>
        <div class="form-group" style="margin-top:12px"><label>Промпт</label><textarea id="videoP" placeholder="Пролёт над городом на закате"></textarea></div>
        <button class="btn-primary btn-sm" id="videoBtn">Сгенерировать</button>
        <div id="videoOut" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></div>
      </div>
      <div class="card">
        <h3>🎵 Музыка</h3>
        <div class="form-group" style="margin-top:12px"><label>Промпт</label><textarea id="musicP" placeholder="Спокойный lo-fi для лендинга"></textarea></div>
        <button class="btn-primary btn-sm" id="musicBtn">Сгенерировать</button>
        <div id="musicOut" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></div>
      </div>
    </div>
  </main>
</div>
<script src="../js/core.js"></script>
<script>
  const session = AC.requireAuth();
  AC.applyTheme();
  document.getElementById('userLogin').textContent = session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href='../index.html'; };
  function gen(btn, out, type) {
    const prompt = document.getElementById(type + 'P').value.trim();
    if (!prompt) return alert('Опиши, что нужно');
    btn.disabled = true; btn.textContent = 'Генерация…'; out.textContent = '';
    setTimeout(() => {
      out.innerHTML = `Готово (превью): <strong>${AC.escapeHtml(prompt.slice(0,80))}</strong><br>Подключи API нейросети для реальной генерации.`;
      btn.disabled = false; btn.textContent = 'Сгенерировать';
    }, 1500);
  }
  document.getElementById('photoBtn').onclick = function(){ gen(this, document.getElementById('photoOut'), 'photo'); };
  document.getElementById('videoBtn').onclick = function(){ gen(this, document.getElementById('videoOut'), 'video'); };
  document.getElementById('musicBtn').onclick = function(){ gen(this, document.getElementById('musicOut'), 'music'); };
</script>
</body>
</html>
