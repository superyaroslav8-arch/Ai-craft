<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Медиа — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo">Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html">Мои сайты</a>
      <a href="create.html">Собрать сайт</a>
      <a href="neuro.html">Нейро</a>
      <a href="media.html" class="active">Медиа</a>
      <a href="links.html">Ссылки</a>
      <a href="settings.html">Настройки</a>
    </nav>
    <div class="side-user"><strong id="userLogin">—</strong><a href="#" id="logout">Выйти</a></div>
  </aside>
  <main class="main">
    <div class="page-head"><h1>Медиа</h1></div>
    <div class="domain-row" id="tabs" style="margin-bottom:20px">
      <button type="button" class="chip active" data-tab="photo">Фото</button>
      <button type="button" class="chip" data-tab="video">Кадр видео</button>
      <button type="button" class="chip" data-tab="music">Музыка (идея)</button>
    </div>
    <div class="create-layout">
      <div class="prompt-box">
        <h2 id="tabTitle">Сгенерировать фото</h2>
        <p class="hint">Опишите, что нужно. Фото создаётся по тексту (бесплатный AI).</p>
        <div class="form-group"><label>Описание</label><textarea id="prompt" placeholder="Уютная кофейня, тёплый свет, утро, фотореализм"></textarea></div>
        <button class="btn-primary" type="button" id="gen">Сгенерировать</button>
        <p id="status" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></p>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Результат</h3>
        <div id="result" style="min-height:220px;display:grid;place-items:center;background:var(--bg);border-radius:12px;border:1px dashed var(--border);color:var(--text-muted);padding:12px">Здесь появится результат</div>
      </div>
    </div>
    <div style="margin-top:24px"><h2 style="font-size:14px;color:var(--text-muted);margin-bottom:12px">История</h2><div id="history" class="grid-cards"></div></div>
  </main>
</div>
<nav class="mobile-nav">
  <a href="dashboard.html">Сайты</a>
  <a href="create.html">Собрать</a>
  <a href="neuro.html">Нейро</a>
  <a href="settings.html">Ещё</a>
</nav>
<script src="../js/core.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const session = AC.requireAuth('auth.html');
  if (!session) return;
  AC.applyTheme();
  document.getElementById('userLogin').textContent = session.name || session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href = 'auth.html'; };
  const KEY = 'aicraft_media_' + session.login;
  let tab = 'photo', history = [];
  try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  document.querySelectorAll('#tabs .chip').forEach(c => c.onclick = () => {
    tab = c.dataset.tab;
    document.querySelectorAll('#tabs .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    document.getElementById('tabTitle').textContent =
      tab === 'photo' ? 'Сгенерировать фото' : tab === 'video' ? 'Кадр для видео' : 'Идея для музыки';
  });
  function renderHistory() {
    const el = document.getElementById('history');
    if (!history.length) { el.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Пока пусто</p>'; return; }
    el.innerHTML = history.slice(0, 12).map(h => h.url
      ? '<div class="card"><img src="'+h.url+'" alt="" loading="lazy" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-bottom:8px"><div class="meta">'+h.type+'</div><p>'+AC.escapeHtml((h.prompt||'').slice(0,70))+'</p></div>'
      : '<div class="card"><div class="meta">'+h.type+'</div><p>'+AC.escapeHtml((h.prompt||'').slice(0,90))+'</p></div>'
    ).join('');
  }
  document.getElementById('gen').onclick = () => {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { AC.toast('Напишите описание'); return; }
    const btn = document.getElementById('gen');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    btn.disabled = true;
    status.textContent = 'Генерация… 5–20 секунд';
    if (tab === 'music') {
      result.innerHTML = '<p style="line-height:1.6;text-align:left">Идея трека: «' + AC.escapeHtml(prompt) + '». Подберите похожий трек на бесплатных библиотеках (Pixabay Music, Free Music Archive).</p>';
      history.unshift({ type: 'music', prompt, at: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(history.slice(0, 40)));
      status.textContent = 'Готово';
      btn.disabled = false;
      renderHistory();
      return;
    }
    const fullPrompt = tab === 'video' ? ('cinematic film still, ' + prompt) : prompt;
    const url = AC.imageUrl(fullPrompt, { width: 768, height: 512 });
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      result.innerHTML = '';
      img.style.cssText = 'width:100%;border-radius:12px;display:block';
      result.appendChild(img);
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Открыть в полном размере';
      a.style.cssText = 'display:inline-block;margin-top:10px;font-size:13px;color:var(--accent)';
      result.appendChild(a);
      history.unshift({ type: tab, prompt, url, at: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(history.slice(0, 40)));
      status.textContent = 'Готово';
      btn.disabled = false;
      renderHistory();
      AC.toast('Готово');
    };
    img.onerror = () => {
      status.textContent = 'Ошибка сети. Нажмите ещё раз.';
      btn.disabled = false;
      result.innerHTML = '<p>Не загрузилось. Повторите попытку.</p>';
    };
    result.innerHTML = '<p>Загрузка изображения…</p>';
    img.src = url + '&t=' + Date.now();
  };
  renderHistory();
});
</script>
</body>
</html>
