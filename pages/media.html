<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Медиа — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo">Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html">Мои сайты</a>
      <a href="create.html">Собрать сайт</a>
      <a href="neuro.html">Нейро</a>
      <a href="media.html" class="active">Медиа</a>
      <a href="links.html">Ссылки</a>
      <a href="settings.html">Настройки</a>
    </nav>
    <div class="side-user"><strong id="userLogin">—</strong><a href="#" id="logout">Выйти</a></div>
  </aside>
  <main class="main">
    <div class="page-head"><h1>Медиа</h1></div>
    <div class="domain-row" id="tabs" style="margin-bottom:20px">
      <button type="button" class="chip active" data-tab="photo">Фото</button>
      <button type="button" class="chip" data-tab="video">Видео</button>
      <button type="button" class="chip" data-tab="music">Музыка</button>
    </div>
    <div class="create-layout">
      <div class="prompt-box">
        <h2 id="tabTitle">Сгенерировать фото</h2>
        <p class="hint" id="tabHint">Реальная картинка по вашему тексту (бесплатно).</p>
        <div class="form-group"><label>Описание</label>
          <textarea id="prompt" placeholder="Уютная кофейня, тёплый свет, чашка капучино"></textarea>
        </div>
        <button class="btn-primary" type="button" id="gen">Сгенерировать</button>
        <p id="status" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></p>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Результат</h3>
        <div id="result" style="min-height:220px;display:grid;place-items:center;background:var(--bg);border-radius:12px;border:1px dashed var(--border);color:var(--text-muted);padding:12px">Превью</div>
      </div>
    </div>
    <div style="margin-top:24px"><h2 style="font-size:14px;color:var(--text-muted);margin-bottom:12px">История</h2><div id="history" class="grid-cards"></div></div>
  </main>
</div>
<nav class="mobile-nav">
  <a href="dashboard.html">Сайты</a>
  <a href="create.html">Собрать</a>
  <a href="neuro.html">Нейро</a>
  <a href="settings.html">Ещё</a>
</nav>
<script src="../js/core.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const session = AC.requireAuth('../index.html');
  if (!session) return;
  AC.applyTheme();
  document.getElementById('userLogin').textContent = session.name || session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href = '../index.html'; };
  const KEY = 'aicraft_media_' + session.login;
  let tab = 'photo', history = [];
  try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  document.querySelectorAll('#tabs .chip').forEach(c => c.onclick = () => {
    tab = c.dataset.tab;
    document.querySelectorAll('#tabs .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    const map = {
      photo: ['Сгенерировать фото', 'Реальная картинка по тексту.'],
      video: ['Сценарий видео', 'Текст сценария.'],
      music: ['Описание трека', 'Жанр и настроение.']
    };
    document.getElementById('tabTitle').textContent = map[tab][0];
    document.getElementById('tabHint').textContent = map[tab][1];
  });
  function renderHistory() {
    const el = document.getElementById('history');
    if (!history.length) { el.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Пока пусто</p>'; return; }
    el.innerHTML = history.slice(0, 12).map(h => h.url
      ? '<div class="card"><img src="' + h.url + '" alt="" loading="lazy" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px"><p style="font-size:12px">' + AC.escapeHtml(h.prompt.slice(0, 80)) + '</p></div>'
      : '<div class="card"><div class="meta">' + h.type + '</div><p>' + AC.escapeHtml((h.text || h.prompt || '').slice(0, 120)) + '</p></div>'
    ).join('');
  }
  document.getElementById('gen').onclick = () => {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { AC.toast('Напишите описание'); return; }
    const btn = document.getElementById('gen');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    btn.disabled = true; status.textContent = 'Генерация…';
    if (tab === 'photo') {
      const url = AC.imageUrl(prompt, { width: 768, height: 512 });
      const img = new Image();
      img.onload = () => {
        result.innerHTML = ''; img.style.width = '100%'; img.style.borderRadius = '12px'; img.alt = prompt;
        result.appendChild(img);
        history.unshift({ type: 'photo', prompt, url, at: Date.now() });
        localStorage.setItem(KEY, JSON.stringify(history.slice(0, 40)));
        status.textContent = 'Готово'; btn.disabled = false; renderHistory(); AC.toast('Фото готово');
      };
      img.onerror = () => { status.textContent = 'Ошибка загрузки. Попробуйте снова.'; btn.disabled = false; };
      img.src = url;
      result.innerHTML = '<p style="color:var(--text-muted)">Загрузка…</p>';
    } else if (tab === 'video') {
      const text = 'Сценарий\n\n1. Заставка: ' + prompt + '\n2. Основная сцена\n3. Финал\n\n15–30 сек.';
      result.innerHTML = '<pre style="white-space:pre-wrap;font-size:13px;text-align:left;width:100%">' + AC.escapeHtml(text) + '</pre>';
      history.unshift({ type: 'video', prompt, text, at: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(history.slice(0, 40)));
      status.textContent = 'Готово'; btn.disabled = false; renderHistory();
    } else {
      const text = 'Трек: ' + prompt + '\n\nЖанр по описанию\nТемп: средний\nДля сайта / ролика';
      result.innerHTML = '<pre style="white-space:pre-wrap;font-size:13px;text-align:left;width:100%">' + AC.escapeHtml(text) + '</pre>';
      history.unshift({ type: 'music', prompt, text, at: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(history.slice(0, 40)));
      status.textContent = 'Готово'; btn.disabled = false; renderHistory();
    }
  };
  renderHistory();
});
</script>
</body>
</html>
