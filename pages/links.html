<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ссылки — Ai крафт</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="../index.html" class="logo">Ai крафт</a>
    <nav class="side-nav">
      <a href="dashboard.html">Проекты</a>
      <a href="create.html">Создать сайт</a>
      <a href="editor.html">Редактор кода</a>
      <a href="links.html" class="active">Ссылки</a>
      <a href="neuro.html">Нейро</a>
      <a href="settings.html">Настройки</a>
      <a href="media.html">Медиа AI</a>
    </nav>
    <div class="side-user"><strong id="userLogin">—</strong><a href="#" id="logout">Выйти</a></div>
  </aside>
  <main class="main">
    <div class="page-head"><h1>Короткие ссылки</h1></div>
    <div class="create-layout">
      <div class="prompt-box">
        <h2>Новая ссылка</h2>
        <div class="form-group"><label>Название</label><input id="title" placeholder="Мой лендинг"></div>
        <div class="form-group"><label>URL</label><input id="url" placeholder="https://..."></div>
        <div class="form-group"><label>Слаг</label><input id="slug" placeholder="my-site"></div>
        <button class="btn-primary" type="button" id="create">Создать</button>
      </div>
      <div class="card"><h3 style="margin-bottom:12px">Ваши ссылки</h3><div id="list"></div></div>
    </div>
  </main>
</div>
<nav class="mobile-nav"><a href="dashboard.html">Проекты</a><a href="create.html">Создать</a><a href="editor.html">Код</a><a href="neuro.html">Нейро</a><a href="settings.html">Ещё</a></nav>
<script src="../js/core.js"></script>
<script>
  const session = AC.requireAuth(); AC.applyTheme();
  document.getElementById('userLogin').textContent = session.login;
  document.getElementById('logout').onclick = e => { e.preventDefault(); AC.clearSession(); location.href='../index.html'; };
  function render() {
    const links = AC.getLinks(session.login);
    const el = document.getElementById('list');
    if (!links.length) { el.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Пока нет ссылок</p>'; return; }
    el.innerHTML = '<table class="table"><thead><tr><th>Короткая</th><th>Куда</th><th></th></tr></thead><tbody>' +
      links.map(l => `<tr><td><code>${AC.escapeHtml(l.shortUrl)}</code></td><td>${AC.escapeHtml(l.url)}</td><td><button type="button" data-copy="${AC.escapeHtml(l.shortUrl)}">Копировать</button> <button type="button" data-del="${l.id}">Удалить</button></td></tr>`).join('') + '</tbody></table>';
    el.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => AC.toast('Скопировано')));
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Удалить?')) { AC.deleteLink(session.login, b.dataset.del); render(); } });
  }
  document.getElementById('create').onclick = () => {
    const title = document.getElementById('title').value.trim();
    const url = document.getElementById('url').value.trim();
    const slug = document.getElementById('slug').value.trim();
    if (!url) { AC.toast('Укажи URL'); return; }
    AC.createLink(session.login, { title, url, slug });
    document.getElementById('title').value=''; document.getElementById('url').value=''; document.getElementById('slug').value='';
    render(); AC.toast('Ссылка создана');
  };
  render();
</script>
</body>
</html>
