<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ai крафт — вход по фото</title>
  <meta name="description" content="Войдите по фото и соберите сайт. Бесплатно.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
    .gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow)}
    .gate-card h1{font-size:22px;text-align:center;margin:12px 0 6px;font-weight:700}
    .gate-card .lead{text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:20px}
    .cam-box{position:relative;aspect-ratio:4/3;background:#111;border-radius:16px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
    .cam-box video,.cam-box img{width:100%;height:100%;object-fit:cover;display:block}
    .cam-box .ph{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:14px;padding:16px;text-align:center}
    .gate-actions{display:flex;flex-direction:column;gap:8px}
    .gate-alt{text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)}
    .check{display:none;text-align:center;padding:12px;border-radius:12px;background:rgba(52,211,153,.12);color:var(--ok);font-size:14px;margin-bottom:12px}
    .check.on{display:block}
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="logo" style="justify-content:center;display:flex">Ai крафт</div>
      <h1>Вход по фото</h1>
      <p class="lead">Камера сфотографирует вас — и вы сразу в работе. Без логина и пароля.</p>
      <div class="check" id="check">Проверено. Открываем кабинет…</div>
      <div class="cam-box" id="camBox">
        <video id="video" autoplay playsinline muted></video>
        <img id="shot" alt="" hidden>
        <div class="ph" id="ph">Разрешите камеру или войдите без фото</div>
      </div>
      <div class="form-group">
        <label>Как к вам обращаться</label>
        <input id="name" placeholder="Имя" autocomplete="name">
      </div>
      <div class="gate-actions">
        <button type="button" class="btn-primary btn-block" id="btnSnap">Сфотографировать и войти</button>
        <button type="button" class="btn-ghost btn-block" id="btnSkip" style="justify-content:center">Войти без фото</button>
      </div>
      <p class="gate-alt">Фото только на этом устройстве</p>
    </div>
  </div>
  <script src="js/core.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      AC.applyTheme();
      if (AC.getSession()) { location.href = 'pages/dashboard.html'; return; }
      const video = document.getElementById('video');
      const shot = document.getElementById('shot');
      const ph = document.getElementById('ph');
      let stream = null, photoData = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream; ph.hidden = true;
      } catch (e) { ph.textContent = 'Камера недоступна — можно войти без фото'; }
      function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); }
      function enter(withPhoto) {
        const name = document.getElementById('name').value.trim() || 'Гость';
        document.getElementById('check').classList.add('on');
        AC.enterWithPhoto({ name, photoDataUrl: withPhoto ? photoData : null });
        stopCam();
        setTimeout(() => { location.href = 'pages/dashboard.html'; }, 500);
      }
      document.getElementById('btnSnap').onclick = () => {
        if (stream && video.videoWidth) {
          const c = document.createElement('canvas');
          c.width = video.videoWidth; c.height = video.videoHeight;
          c.getContext('2d').drawImage(video, 0, 0);
          photoData = c.toDataURL('image/jpeg', 0.85);
          shot.src = photoData; shot.hidden = false; video.hidden = true; ph.hidden = true;
        }
        enter(!!photoData);
      };
      document.getElementById('btnSkip').onclick = () => enter(false);
    });
  </script>
</body>
</html>
