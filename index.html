<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai-Craft — AI Website Builder</title>
  
  <!-- PWA и иконки -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  
  <link rel="stylesheet" href="style.css">
  <!-- Загрузчик Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body data-theme="dark">

  <div class="app-container nav-bottom" id="app">
    <main class="main-content">
      <header class="top-bar">
        <div class="logo">Ai-Craft 🚀</div>
        <div class="actions">
          <button class="btn btn-primary" onclick="generateSite()">⚡ Сгенерировать AI</button>
          <button class="btn btn-secondary" onclick="createPreviewLink()">🔗 Создать ссылку</button>
        </div>
      </header>

      <div class="workspace">
        <section class="editor-section">
          <div class="section-header">Код сайта (HTML/CSS)</div>
          <div id="editor-container"></div>
        </section>

        <aside class="chat-section">
          <div class="section-header">AI-Помощник «Нейро»</div>
          <div class="chat-messages" id="chat-messages">
            <div class="message neuro">Привет! Я **Нейро**. Помогу сгенерировать сайт или ответить на вопросы. Напиши, что сделать!</div>
          </div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Спроси Нейро или опиши сайт...">
            <button class="btn btn-primary" id="send-btn">Отправить</button>
          </div>
        </aside>
      </div>
    </main>

    <nav class="navbar" id="navbar">
      <button class="nav-btn active">💻 Редактор</button>
      <button class="nav-btn">🤖 Нейрочат</button>
      <button class="nav-btn" onclick="toggleSettingsModal()">⚙️ Настройки</button>
    </nav>
  </div>

  <!-- Модальное окно настроек -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>Настройки Ai-Craft</h3>
      
      <div class="setting-item">
        <label>Тема оформления:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="dark">Тёмная</option>
          <option value="light">Светлая</option>
        </select>
      </div>

      <div class="setting-item">
        <label>Расположение панели:</label>
        <select id="nav-pos-select" onchange="changeNavPosition(this.value)">
          <option value="bottom">Внизу (По умолчанию)</option>
          <option value="top">Наверху</option>
        </select>
      </div>

      <div class="setting-item">
        <label>Акцентный цвет:</label>
        <input type="color" id="accent-color-picker" value="#238636" onchange="changeAccentColor(this.value)">
      </div>

      <button class="btn btn-secondary" onclick="toggleSettingsModal()">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
